{# Runtime overrides of the admin design tokens, from Settings → Admin Appearance.
   adminThemeCss is built (and hex-validated) by _admin_theme_css() in app/routes/admin.py;
   it is empty for the default Ministry Gold theme. #}
<style id="swm-admin-theme">
  :root {
    {{ adminThemeCss|safe }}
    --swm-primary: var(--color-gold);
    --swm-primary-dark: var(--color-gold-text);
    --swm-primary-light: var(--color-gold-hi);
    --swm-secondary: var(--color-chrome);
  }
</style>
