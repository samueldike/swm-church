{% extends "admin/_auth-card.html" %}
{% block page_title %}Choose a new password{% endblock %}
{% block card_title %}Choose a new password{% endblock %}
{% block card %}
<p class="text-[13.5px] text-ink-2 mb-4">For <b>{{ email }}</b>. {{ rules }} You will be signed out everywhere else.</p>
<form method="POST" action="{{ url_for('admin_reset_password_submit', token=token) }}" class="flex flex-col gap-4" data-turbo="false" data-no-loading>
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
  <div>
    <label for="password" class="field-label">New password</label>
    <input id="password" name="password" type="password" required autocomplete="new-password" class="field-input field-mono">
  </div>
  <div>
    <label for="password_confirmation" class="field-label">Confirm new password</label>
    <input id="password_confirmation" name="password_confirmation" type="password" required autocomplete="new-password" class="field-input field-mono">
  </div>
  <button type="submit" class="btn btn-primary btn-lg w-full mt-1">Save new password</button>
</form>
{% endblock %}
