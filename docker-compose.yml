services:
  app:
    build: .
    container_name: swm-app
    restart: unless-stopped
    env_file: .env
    environment:
      MEDIA_ROOT: /app/media
    expose:
      - "8000"
    volumes:
      - static_files:/app/static
      - media_files:/app/media
      - telegram_bot_api_conf:/run/swm-telegram
      - telegram_archive:/app/telegram-archive   # private: never under /app/media (served publicly)
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      telegram-bot-api:
        condition: service_started
    networks:
      - swm-net

  worker:
    build: .
    container_name: swm-worker
    restart: unless-stopped
    env_file: .env
    environment:
      MEDIA_ROOT: /app/media
    command: celery -A app.celery_app worker -l info -c 4
    volumes:
      - static_files:/app/static
      - media_files:/app/media
      - telegram_archive:/app/telegram-archive
    depends_on:
      - app
      - telegram-bot-api
    networks:
      - swm-net

  # Speech-to-text (Whisper on the CPU, ~3GB per loaded model): its own queue, ONE job at a
  # time, memory-capped, so transcriptions never starve Telegram sends or the website.
  transcriber:
    build: .
    container_name: swm-transcriber
    restart: unless-stopped
    env_file: .env
    command: celery -A app.celery_app worker -Q transcription -c 1 -n transcriber@%h -l info
    mem_limit: 5g
    volumes:
      - media_files:/app/media
      - telegram_archive:/app/telegram-archive
      - whisper_models:/root/.cache/huggingface    # the model is downloaded once, not on every rebuild
    depends_on:
      - app
    networks:
      - swm-net

  beat:
    build: .
    container_name: swm-beat
    restart: unless-stopped
    env_file: .env
    command: celery -A app.celery_app beat -l info
    depends_on:
      - app
    networks:
      - swm-net

  # Self-hosted Bot API server in --local mode: uploads up to 2000MB instead of 50MB.
  # Its api_id/api_hash are saved by an administrator in Settings → Audio distribution
  # (encrypted); the app writes them to telegram_bot_api_conf and the entrypoint
  # starts/restarts the server from there. It idles until they are saved.
  # The media volume is mounted at the SAME path as in the app container so
  # file:// handoffs resolve identically on both sides.
  telegram-bot-api:
    image: aiogram/telegram-bot-api:latest
    container_name: swm-telegram-bot-api
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/swm/entrypoint.sh"]
    environment:
      TELEGRAM_LOCAL: "1"
    expose:
      - "8081"
    volumes:
      - telegram_bot_api_data:/var/lib/telegram-bot-api
      - telegram_bot_api_conf:/run/swm-telegram:ro
      - ./deploy/telegram-bot-api/entrypoint.sh:/swm/entrypoint.sh:ro
      - media_files:/app/media:ro
    networks:
      - swm-net

  postgres:
    image: postgres:16-alpine
    container_name: swm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: swm_db
      POSTGRES_USER: swm_user
      POSTGRES_PASSWORD: swm_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U swm_user -d swm_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - swm-net

  redis:
    image: redis:7-alpine
    container_name: swm-redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - swm-net

  nginx:
    image: nginx:alpine
    container_name: swm-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - static_files:/app/static:ro
      - media_files:/app/media:ro
      - certbot_www:/var/www/certbot:ro
      - certbot_certs:/etc/letsencrypt:ro
    depends_on:
      - app
    networks:
      - swm-net

  certbot:
    image: certbot/certbot
    container_name: swm-certbot
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_certs:/etc/letsencrypt
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    networks:
      - swm-net

volumes:
  postgres_data:
  telegram_bot_api_data:
  telegram_bot_api_conf:
  telegram_archive:
  whisper_models:
  static_files:
  media_files:
  certbot_www:
  certbot_certs:

networks:
  swm-net:
    driver: bridge
