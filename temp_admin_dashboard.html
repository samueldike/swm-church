<!DOCTYPE html>
<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Admin Login - Scent of Water Ministry</title>
<link rel="icon" href="/images/swm-logo.png" type="image/png"/>
<link rel="apple-touch-icon" href="/images/swm-logo.png"/>

<script src="http://127.0.0.1:8000/js/tailwind-browser.global.js"></script>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&amp;display=swap" rel="stylesheet"/>
<script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#b38b2e",
                        "primary-dark": "#8f6e22",
                        "primary-light": "#e6c87d",
                        "secondary": "#1a1a1a",
                        "secondary-light": "#2a2a2a",
                        "background-light": "#f8f8f7",
                        "sidebar-bg": "#141414",
                        "muted": "#9ca3af"
                    },
                    fontFamily: {
                        "sans": ["Manrope", "sans-serif"],
                        "serif": ["Playfair Display", "serif"]
                    },
                    boxShadow: {
                        'soft': '0 4px 20px -2px rgba(0, 0, 0, 0.05)',
                        'glow': '0 0 15px rgba(179, 139, 46, 0.2)',
                    }
                },
            },
        }
    </script>
<style type="text/tailwindcss">
        @layer utilities {
            .nav-item {
                @apply flex items-center gap-3 px-4 py-2.5 rounded-lg text-gray-400 hover:text-white hover:bg-white/5 transition-all duration-200;
            }
            .nav-item.active {
                @apply bg-primary/10 text-primary border-r-2 border-primary rounded-r-none;
            }
            .stat-card {
                @apply bg-white p-6 rounded-2xl border border-gray-100 shadow-soft;
            }
            .action-btn {
                @apply flex items-center gap-3 w-full p-4 bg-white border border-gray-100 rounded-xl hover:border-primary hover:shadow-md transition-all text-left;
            }
            .calendar-mini-day {
                @apply aspect-square flex items-center justify-center text-sm rounded-lg transition-colors;
            }
        }
    </style>
<style>
    /* SWM theme color fallback */
    :root {
        --swm-primary: #b38b2e;
        --swm-primary-dark: #8f6e22;
        --swm-primary-light: #e6c87d;
        --swm-secondary: #1a1a1a;
    }

    .bg-primary { background-color: var(--swm-primary) !important; }
    .text-primary { color: var(--swm-primary) !important; }
    .border-primary { border-color: var(--swm-primary) !important; }

    .bg-secondary { background-color: var(--swm-secondary) !important; }
    .text-secondary { color: var(--swm-secondary) !important; }
    .border-secondary { border-color: var(--swm-secondary) !important; }

    .text-primary-light { color: var(--swm-primary-light) !important; }

    .hover\:bg-primary:hover { background-color: var(--swm-primary) !important; }
    .hover\:bg-primary-dark:hover { background-color: var(--swm-primary-dark) !important; }
    .hover\:text-primary:hover { color: var(--swm-primary) !important; }
    .hover\:border-primary:hover { border-color: var(--swm-primary) !important; }
</style>

</head>
<body class="bg-background-light text-secondary font-sans antialiased overflow-hidden">
<main class="min-h-screen flex items-center justify-center bg-background-light px-6">
  <div class="w-full max-w-md bg-white rounded-2xl border border-gray-100 shadow-soft p-8">
    <div class="flex items-center gap-3 mb-6">
      <div class="w-10 h-10 rounded-full bg-primary/20 flex items-center justify-center border border-primary/30">
        <span class="text-primary font-bold text-xs uppercase">SWM</span>
      </div>
      <div>
        <h1 class="text-xl font-serif font-bold text-secondary">Admin Login</h1>
        <p class="text-xs text-gray-500">Scent of Water Ministry</p>
      </div>
    </div>
    <form method="POST" action="http://127.0.0.1:8000/admin/login" class="space-y-4">
      <input type="hidden" name="_token" value="16EEE25FKMoiQEeAqskbNLpbBEZ08SpLn6cLw2vH" autocomplete="off">      <div>
        <label class="text-xs font-bold uppercase tracking-wider text-gray-500" for="email">Email</label>
        <input id="email" name="email" type="email" required class="mt-2 w-full px-4 py-3 rounded-xl border border-gray-200 bg-gray-50 focus:outline-none focus:ring-2 focus:ring-primary/40" />
      </div>
      <div>
        <label class="text-xs font-bold uppercase tracking-wider text-gray-500" for="password">Password</label>
        <input id="password" name="password" type="password" required class="mt-2 w-full px-4 py-3 rounded-xl border border-gray-200 bg-gray-50 focus:outline-none focus:ring-2 focus:ring-primary/40" />
      </div>
      <button type="submit" class="w-full h-12 rounded-xl bg-secondary text-white font-bold text-sm hover:bg-primary transition-all">Sign In</button>
    </form>
  </div>
</main>
</body></html>
