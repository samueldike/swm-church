services:
  app:
    build: .
    container_name: swm-app
    restart: unless-stopped
    env_file: .env
    expose:
      - "8000"
    volumes:
      - static_files:/app/static
      - media_files:/app/media
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - swm-net

  worker:
    build: .
    container_name: swm-worker
    restart: unless-stopped
    env_file: .env
    command: celery -A app.celery_app worker -l info -c 4
    volumes:
      - static_files:/app/static
      - media_files:/app/media
    depends_on:
      - app
    networks:
      - swm-net

  beat:
    build: .
    container_name: swm-beat
    restart: unless-stopped
    env_file: .env
    command: celery -A app.celery_app beat -l info
    depends_on:
      - app
    networks:
      - swm-net

  postgres:
    image: postgres:16-alpine
    container_name: swm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: swm_db
      POSTGRES_USER: swm_user
      POSTGRES_PASSWORD: swm_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U swm_user -d swm_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - swm-net

  redis:
    image: redis:7-alpine
    container_name: swm-redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - swm-net

  nginx:
    image: nginx:alpine
    container_name: swm-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - static_files:/app/static:ro
      - media_files:/app/media:ro
      - certbot_www:/var/www/certbot:ro
      - certbot_certs:/etc/letsencrypt:ro
    depends_on:
      - app
    networks:
      - swm-net

  certbot:
    image: certbot/certbot
    container_name: swm-certbot
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_certs:/etc/letsencrypt
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    networks:
      - swm-net

volumes:
  postgres_data:
  static_files:
  media_files:
  certbot_www:
  certbot_certs:

networks:
  swm-net:
    driver: bridge
